<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contatos - Eng. Elaine Silva</title>
</head>
<body class="body-content">
    <header class="header-section">
        <h1>Contatos</h1>
        <p>Entre em contato com a Engenheira Elaine Silva</p>
    </header>
    <div class="form-container">
        <form action="#" method="post" class="contact-form">
            <label for="nome" class="form-label">Nome:</label>
            <br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required class="form-input">
            <br>
            <label for="email" class="form-label">E-mail:</label>
            <br>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required class="form-input">
            <br>
            <label for="mensagem" class="form-label">Mensagem:</label>
            <br>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem" required class="form-textarea"></textarea>
            <br>
            <button type="submit" class="form-button">Enviar</button>
        </form>
    </div>
    <a href="index.html" class="back-link">Voltar a página principal</a>
</body>
</html>
