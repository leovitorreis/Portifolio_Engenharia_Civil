<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Solicitação de Orçamento</h1>
        <p>Preencha o formulário abaixo para enviar sua solicitação</p>
    </header>
    
    <div class="container">
        <form action="processo_formulario.php" method="post">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            <br>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            <br>
            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone">
            <br>
            <label for="servico">Tipo de Serviço:</label><br>
            <select id="servico" name="servico" required>
                <option value="" disabled selected>Selecione um serviço</option>
                <option value="projeto-arquitetonico">Projeto Arquitetônico</option>
                <option value="gestao-obras">Gestão de Obras</option>
                <option value="consultoria-tecnica">Consultoria Técnica</option>
                <option value="outro">Outro</option>
            </select>
            <br>
            <label for="mensagem">Detalhes da Solicitação:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Descreva sua solicitação" required></textarea>
            <br>
            <button type="submit">Enviar Solicitação</button>
        </form>
    </div>
    <a href="index.html">Voltar a página principal</a>
</body>
</html>
